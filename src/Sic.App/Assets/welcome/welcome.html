<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SicTerm welcome</title>
<style>
/* The fonts SicTerm ships in Assets\fonts, which the host maps beside this page: Sora for headings and the wordmark's "Sic",
   Azeret Mono for its "Term". Both are variable, so one file gives every weight. */
@font-face { font-family: "Sora"; src: url("../fonts/Sora.ttf") format("truetype"); font-weight: 100 800; }
@font-face { font-family: "Azeret Mono"; src: url("../fonts/AzeretMono.ttf") format("truetype"); font-weight: 100 900; }
/* The first-run film and card (docs/decisions/first-run.md). The chrome's colors arrive in the host's init message and set
   these variables; the values here are SicTerm Dark, for a page that is shown before the message lands. The miniature's
   terminals keep the fixed dark palette, as the app's do, and so do the film's desktop and its dark screen: the captions
   over them keep the film's own light ink under every theme, since a light theme's text is dark grey. The miniature's tab
   strip and status bar take the strip ink, the color the real strip picks for its titles on the rail color. */
:root {
  --base: #01263E; --rail: #011E32; --panel: #003050; --layer: rgba(255,255,255,.06); --hover: rgba(255,255,255,.08);
  --stroke: rgba(136,202,223,.15); --stroke-strong: rgba(136,202,223,.25);
  --text: #FFFFFF; --text2: #88CADF; --text3: rgba(136,202,223,.7); --strip-text: #FFFFFF;
  --film-text: #FFFFFF; --film-text2: #CFE6EF;
  --accent: #009DC1; --accent-ink: #01263E; --accent-soft: rgba(0,157,193,.2);
  --term: #011726; --ok: #5FC27A; --warn: #F2C55E; --danger: #F0736A;
  --h-hermes: #E3B341; --h-claude: #F0A47E; --h-codex: #5FD1B2; --h-opencode: #B9A3F0;
  --display: Sora, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --wordmark-term: "Azeret Mono", "Cascadia Mono", Consolas, monospace;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
  --ease-out: cubic-bezier(.1,.9,.2,1); --ease-in: cubic-bezier(.7,0,1,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--base); color: var(--text); font-family: var(--body); font-size: 13px; -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { display: block; }
[hidden] { display: none !important; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* the stage: the film's own frame, 812×662, scaled to the window's tab area */
.stage { position: absolute; left: 50%; top: 50%; width: 812px; height: 662px; transform: translate(-50%, -50%); transform-origin: 50% 50%; }
.film { position: absolute; inset: 0; z-index: 1; transition: filter .5s; }
.film.ambient { filter: brightness(.42) saturate(.75); }
.film.ambient .cap { visibility: hidden; }
.desk { position: absolute; inset: 0; background: radial-gradient(70% 60% at 30% 35%, rgba(0,104,150,.45), transparent 60%), radial-gradient(50% 50% at 75% 70%, rgba(0,157,193,.25), transparent 60%), linear-gradient(160deg, #04263E, #011A2C 70%); opacity: 0; transform: scaleY(.004); transition: transform .35s var(--ease-out), opacity .15s; }
.desk.on { opacity: 1; transform: none; }
.desk.off { transition: transform .3s var(--ease-in), opacity .12s .22s; transform: scaleY(.004); opacity: 0; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: rgba(0,0,0,.38); display: flex; justify-content: center; align-items: center; gap: 10px; }
.taskbar i { width: 16px; height: 16px; border-radius: 4px; background: rgba(255,255,255,.14); display: block; }
.tbtn { width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; position: relative; transition: background .2s; }
.tbtn.hover { background: rgba(255,255,255,.12); }
.tbtn.run::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 1px; height: 2px; border-radius: 1px; background: var(--accent); }
.led { position: absolute; left: 50%; bottom: 44px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: rgba(136,219,223,.12); transition: background .3s, box-shadow .3s; z-index: 9; }
.led.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.cap { position: absolute; left: 24px; right: 24px; top: 26px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.2; color: var(--film-text); text-shadow: 0 2px 14px rgba(0,0,0,.65); opacity: 0; transform: translateY(8px); transition: opacity .35s var(--ease-out), transform .35s var(--ease-out); pointer-events: none; z-index: 8; text-wrap: balance; }
.cap.in { opacity: 1; transform: none; }
/* a second sentence under the first, arriving on its own while the first stays */
.cap .l { opacity: 0; transform: translateY(8px); transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); }
.cap .l.in { opacity: 1; transform: none; }
.cap .l + .l { margin-top: 10px; }
.cap.dark { top: auto; bottom: 84px; font-size: 22px; font-weight: 600; color: var(--film-text2); z-index: 10; }
/* while the window fills the display, the caption moves down over the panes' empty lower half */
.cap.low { top: auto; bottom: 110px; }
.mini { position: absolute; left: 50%; top: 92px; width: 760px; height: 440px; margin-left: -380px; background: var(--base); border: 1px solid var(--stroke-strong); border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.45); overflow: hidden; display: grid; grid-template-columns: 24px 0 1fr; grid-template-rows: 20px 1fr 16px; transition: transform .45s var(--ease-out), opacity .35s, width .9s var(--ease-out), height .9s var(--ease-out), top .9s var(--ease-out), margin-left .9s var(--ease-out), grid-template-columns .6s var(--ease-out), grid-template-rows .6s var(--ease-out), border-radius .6s; z-index: 2; }
.mini.closed { transform: translateY(250px) scale(.12); opacity: 0; transition: transform .4s var(--ease-in), opacity .25s .12s; }
/* the day opens on a window already open and running: it fades in where it stands, instead of growing out of the taskbar */
.mini.unseen { opacity: 0; }
/* F11: the window fills the display, over the taskbar, and its rail leaves its edge */
.mini.full { width: 812px; height: 662px; top: 0; margin-left: -406px; border-radius: 0; grid-template-columns: 0 0 1fr; }
/* the side panel open beside the rail (Sessions or Agent Workspaces), at half the real panel's width */
.mini.panel { grid-template-columns: 24px 168px 1fr; }
/* Settings → Side Panel: Right puts the rail, and the panel beside it, on the right edge. Settings → Tabs: Bottom runs the tab
   bar above the status bar, each tab turned over and each pane's header under its terminal, as the real window does. */
.mini.right { grid-template-columns: 1fr 0 24px; }
.mini.right.panel { grid-template-columns: 1fr 168px 24px; }
.mini.right.full { grid-template-columns: 1fr 0 0; }
/* in full screen the pointer at the display's edge slides the sidebar in over the panes, which stay where they are */
.mini.full .mrail { position: absolute; left: 0; top: 0; bottom: 0; width: 24px; z-index: 5; transform: translateX(-100%); transition: transform .3s var(--ease-out); box-shadow: 4px 0 12px rgba(0,0,0,.35); }
.mini.right.full .mrail { left: auto; right: 0; transform: translateX(100%); box-shadow: -4px 0 12px rgba(0,0,0,.35); }
.mini.full.reveal .mrail { transform: none; }
.mini.right .mrail { grid-column: 3; } .mini.right .mpanel { grid-column: 2; border-right: 0; border-left: 1px solid var(--stroke); }
.mini.right .mstrip, .mini.right .mbody, .mini.right .mstatus { grid-column: 1; }
.mini.right .mnotice { left: 0; right: 24px; }
.mini.bottom { grid-template-rows: 1fr 20px 16px; }
.mini.bottom .mstrip { grid-row: 2; align-items: flex-start; border-top: 1px solid var(--stroke); } .mini.bottom .mbody { grid-row: 1; }
.mini.bottom .mtab { border-radius: 0 0 4px 4px; } .mini.bottom .mtab.colored::before { top: auto; bottom: 0; border-radius: 0 0 4px 4px; }
.mini.bottom .mpane { flex-direction: column-reverse; justify-content: flex-end; }
.mini.bottom .mnotice { bottom: 36px; } .mini.bottom .mnotice:not(.in) { transform: translateY(calc(100% + 36px)); }
.mrail { grid-row: 1 / 4; grid-column: 1; background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 4px; overflow: hidden; }
.mrail .rmark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-bottom: 5px; flex: none; }
.mrail .grow { flex: 1; }
/* the rail's buttons, as the real rail has them: Agent Workspaces, Folders and Sessions above; New session, Resume all, Consolidate tabs and
   Settings below. Resume all and Consolidate tabs take the accent while they have something to do, as the real ones do. A
   caption that names one rings it, and the pointer clicks it as its key goes down beside it. */
.rb { width: 20px; height: 20px; border-radius: 3px; display: grid; place-items: center; flex: none; color: color-mix(in srgb, var(--strip-text) 50%, transparent); transition: background .2s, color .3s, transform .1s; }
.rb svg { width: 12px; height: 12px; }
.rb.lit { color: var(--accent); }
.rb.hover { background: color-mix(in srgb, var(--strip-text) 10%, transparent); }
.rb.press { background: color-mix(in srgb, var(--strip-text) 16%, transparent); transform: scale(.9); }
.rb.mark { animation: ring 1.4s ease-in-out infinite; }
.rb.on { background: color-mix(in srgb, var(--strip-text) 12%, transparent); }
/* the side panel: Sessions, with its search box and its rows, or Folders, with its rows and the chosen folder's card (its menu's emoji, color and sound).
   Its content keeps the open width, so the column slides over it. */
.mpanel { grid-row: 1 / 4; grid-column: 2; background: var(--panel); border-right: 1px solid var(--stroke); overflow: hidden; min-width: 0; }
.mpanel .inner { width: 168px; height: 100%; display: flex; flex-direction: column; animation: fadein .25s; }
.mpanel .hd { height: 20px; display: flex; align-items: center; padding: 0 8px; font-size: 9px; font-weight: 600; color: var(--text); flex: none; }
.mpanel .hd .x { margin-left: auto; width: 14px; height: 14px; border-radius: 3px; display: grid; place-items: center; font-size: 8px; color: var(--text3); transition: background .2s, color .2s; }
.mpanel .hd .x.hover { background: var(--hover); color: var(--text); }
.mpanel .srch { margin: 2px 8px 4px; height: 16px; border: 1px solid var(--stroke-strong); border-radius: 3px; background: var(--layer); display: flex; align-items: center; padding: 0 5px; font-size: 8px; color: var(--text3); white-space: nowrap; transition: border-color .2s, box-shadow .2s; }
.mpanel .srch .q { color: var(--text); }
.mpanel .srch .caret { width: 1px; height: 9px; background: var(--text); opacity: 0; margin: 0 1px; }
.mpanel .srch.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mpanel .srch.focus .caret { opacity: 1; animation: blink 1s steps(1) infinite; }
.mpanel .srch.typed .hint { display: none; }
.mpanel .srch .ico { margin-left: auto; width: 9px; height: 9px; }
.mpanel .cnt { padding: 0 8px 3px; font-size: 7px; color: var(--text3); white-space: nowrap; }
.mpanel .lbl { padding: 4px 8px 1px; font-size: 7px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text3); }
.mpanel .row { display: flex; align-items: center; gap: 5px; padding: 0 8px; height: 24px; overflow: hidden; transition: height .3s var(--ease-out), opacity .3s, background .2s; }
.mpanel .row.f { height: 20px; }
.mpanel .row.hide { height: 0; opacity: 0; }
.mpanel .row.hover { background: var(--hover); }
.mpanel .row.press, .mpanel .row.sel { background: var(--layer); }
.mpanel .row .tile { width: 11px; height: 11px; font-size: 7px; border-radius: 2px; flex: none; }
.mpanel .row .e, .mpanel .row .fi { width: 11px; flex: none; font-size: 9px; text-align: center; color: var(--accent); }
.mpanel .row .fi svg { width: 10px; height: 10px; margin: 0 auto; }
.mpanel .row .t { min-width: 0; flex: 1; }
.mpanel .row .n { font-size: 8px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mpanel .row .s { font-size: 6.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mpanel .row .pin { width: 10px; height: 10px; flex: none; color: var(--text3); opacity: 0; transition: opacity .2s, color .2s; }
.mpanel .row .pin svg { width: 10px; height: 10px; }
.mpanel .row.hover .pin, .mpanel .row.sel .pin { opacity: .8; }
.mpanel .row .pin.hover { color: var(--text); }
.mpanel .row .pin.on, .mpanel .row.pinned .pin { opacity: 1; color: var(--accent); }
.mstrip { grid-row: 1; grid-column: 3; background: var(--rail); display: flex; align-items: flex-end; padding-left: 2px; gap: 1px; overflow: hidden; }
.mtab { height: 16px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 5px; border-radius: 4px 4px 0 0; font-size: 9px; color: var(--strip-text); opacity: .72; background: color-mix(in srgb, var(--strip-text) 4%, transparent); white-space: nowrap; position: relative; transform: translateY(-6px); transition: opacity .25s var(--ease-out), transform .25s var(--ease-out), background .3s; max-width: 86px; opacity: 0; }
.mtab.in { opacity: .78; transform: none; }
.mtab.in.sel { opacity: 1; }
.mtab.lift { opacity: .3; }
.mtab.sel { background: color-mix(in srgb, var(--strip-text) 11%, transparent); }
/* F6: the tabs that share a folder are ringed while the caption names them, then two slide into the first (--dx away) and close */
.mtab.mark { opacity: 1; animation: ring 1.4s ease-in-out infinite; }
.mtab.join { transform: translateX(var(--dx)) scale(.55); opacity: .35; transition: transform .75s var(--ease-in), opacity .75s; }
.mtab .tile { width: 10px; height: 10px; font-size: 7px; border-radius: 2px; }
.mtab .n { overflow: hidden; text-overflow: ellipsis; }
.mtab .d { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--strip-text) 45%, transparent); flex: none; transition: background .3s; }
.mtab.working .d { width: 7px; height: 7px; background: none; border: 1.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.mtab.rest .d { background: var(--ok); }
/* Your turn: the agent has finished and waits; the dot blinks in the warning color, dimming off the beat as the real one does */
.mtab.ready .d { background: var(--warn); animation: blink 1.2s steps(1) infinite; }
.mtab.hover { background: color-mix(in srgb, var(--strip-text) 8%, transparent); }
.mtab.ph .d { background: none; border: 1px solid color-mix(in srgb, var(--strip-text) 50%, transparent); }
.mtab.off .d { background: color-mix(in srgb, var(--strip-text) 12%, transparent); border: 0; animation: none; }
.mtab.colored::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--tc); border-radius: 4px 4px 0 0; }
.mtab.colored.sel { background: color-mix(in srgb, var(--tc) 30%, color-mix(in srgb, var(--strip-text) 11%, transparent)); }
.mtab.gone { opacity: 0; transform: translateY(10px) scale(.8); max-width: 0; padding: 0; margin: 0; transition: all .45s var(--ease-in); }
.mtab.join.gone { transform: translateX(var(--dx)) scale(.4); }
.mbody { grid-row: 2; grid-column: 3; position: relative; overflow: hidden; display: grid; gap: 1px; background: var(--stroke); }
.mpane { background: var(--term); display: flex; flex-direction: column; min-height: 0; min-width: 0; opacity: 0; transition: opacity .4s; }
.mpane.in { opacity: 1; }
/* a placeholder's Resume conversation button under the pointer */
.rbtn { transition: filter .15s; } .rbtn.hover { filter: brightness(1.2); } .rbtn.press { filter: brightness(.85); }
.mph { height: 14px; background: rgba(255,255,255,.11); display: flex; align-items: center; gap: 5px; padding: 0 6px; font-size: 8.5px; color: rgba(255,255,255,.85); flex: none; transition: background .4s; }
.mph .tile { width: 9px; height: 9px; font-size: 6.5px; border-radius: 2px; }
.mph .f { color: rgba(255,255,255,.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mph .grow { flex: 1; }
.mph .ctx { display: none; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.mph .ctx.on { display: flex; }
.mph .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.gl { display: flex; flex-direction: column; gap: 5px; padding: 7px 8px; overflow: hidden; }
.gl i { display: block; height: 4px; border-radius: 2px; background: rgba(136,219,223,.22); opacity: .5; }
.gl i.k { background: rgba(240,164,126,.35); }
/* the pane's body: the skeleton pulses while the session loads (about a second), then the session's own transcript prints,
   line by line, and ends at the prompt with its caret (idle) or on the agent's current step with a spinner (working) */
.mpane.loading .gl i { animation: ghost 1.2s ease-in-out infinite; }
.mpane.loading .gl i:nth-child(2n) { animation-delay: .15s; } .mpane.loading .gl i:nth-child(3n) { animation-delay: .3s; } .mpane.loading .gl i:nth-child(5n) { animation-delay: .5s; }
.mpane.live .gl { display: none; }
.mpane .tx { display: none; padding: 6px 8px; font: 7.5px/11px var(--mono); color: rgba(255,255,255,.82); overflow: hidden; }
.mpane.live .tx { display: block; }
.tx .ln { opacity: 0; animation: lineIn .25s forwards; white-space: pre-wrap; overflow-wrap: anywhere; }
.tx .ln + .ln { margin-top: 2px; }
.tx .u { color: #fff; font-weight: 600; }
.tx .u::before, .tx .c::before { content: "› "; color: var(--h, var(--accent)); font-weight: 700; }
.tx .a { color: rgba(255,255,255,.78); padding-left: 9px; }
.tx .t { color: rgba(255,255,255,.5); padding-left: 9px; }
.tx .t::before { content: "● "; color: var(--h, var(--accent)); }
.tx .w { color: rgba(255,255,255,.7); padding-left: 9px; display: flex; align-items: center; gap: 4px; }
.tx .w i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
.tx .c i { display: inline-block; width: 5px; height: 9px; background: #fff; vertical-align: -1px; animation: blink 1s steps(1) infinite; }
.mpane.working .mph .d { background: none; border: 1.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.mstatus { grid-row: 3; grid-column: 3; background: var(--rail); border-top: 1px solid var(--stroke); display: flex; align-items: center; gap: 7px; padding: 0 8px; font-size: 8.5px; color: var(--strip-text); position: relative; }
.mstatus .grow { flex: 1; }
.meter { display: none; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.meter.on { display: flex; }
.meter .lab { opacity: .7; }
.track { width: 30px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; overflow: visible; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: var(--ok); transition: width 1.1s var(--ease-out), background .4s; }
.track .tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.7); }
.mstatus .track { background: color-mix(in srgb, var(--strip-text) 14%, transparent); }
.mstatus .track .tick { background: color-mix(in srgb, var(--strip-text) 70%, transparent); }
/* a label on a part of the window with a line to it (the gauges, at the first look): 'up' hangs under the part, 'down' stands over it */
.callout { position: absolute; z-index: 6; background: #061B29; color: #fff; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 7px; font: 600 9px var(--body); white-space: nowrap; opacity: 0; transition: opacity .3s; pointer-events: none; }
.callout.in { opacity: 1; }
.callout::before { content: ""; position: absolute; left: var(--lx, 50%); width: 1px; height: 12px; background: var(--accent); }
.callout.up::before { bottom: 100%; } .callout.down::before { top: 100%; }
.mph .ctx.hl, .meter.hl { box-shadow: 0 0 0 1.5px var(--accent); border-radius: 3px; }
.mnotice { position: absolute; left: 24px; right: 0; bottom: 16px; height: 24px; background: #2A3B1C; color: #fff; font-size: 9.5px; display: flex; align-items: center; gap: 8px; padding: 0 10px; transform: translateY(calc(100% + 16px)); transition: transform .2s var(--ease-out); z-index: 3; }
.mnotice.in { transform: none; }
.mnotice i { width: 12px; height: 12px; border-radius: 50%; background: #6CCB5F; color: #11290d; display: grid; place-items: center; font-size: 9px; font-style: normal; font-weight: 700; }
.mnotice b { font-weight: 600; }
.mnotice .x { margin-left: auto; opacity: .7; }
.mcard { position: absolute; left: 60px; top: 90px; width: 236px; background: var(--panel); border: 1px solid var(--stroke-strong); border-radius: 6px; padding: 8px 10px; font-size: 9px; box-shadow: 0 10px 24px rgba(0,0,0,.45); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s var(--ease-out); z-index: 4; }
.mcard.in { opacity: 1; transform: none; }
.mcard .n { font-weight: 600; font-size: 11px; display: flex; align-items: center; gap: 6px; }
.mcard .n .e { min-width: 12px; }
.mcard .p { color: var(--text2); font-family: var(--mono); font-size: 8px; margin: 2px 0 6px; }
.mcard .acts { display: flex; gap: 6px; align-items: center; }
.mcard .acts span { width: 22px; height: 18px; border-radius: 3px; background: var(--layer); display: grid; place-items: center; font-size: 10px; transition: background .3s, box-shadow .3s; position: relative; }
.mcard .acts span.hot { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); }
.mcard .acts .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--tc, #3E699A); }
.mcard .acts svg { width: 11px; height: 11px; }
.mcard .acts .wave { position: absolute; left: 100%; top: 50%; margin-left: 6px; transform: translateY(-50%); font-size: 9px; color: var(--accent); opacity: 0; transition: opacity .2s; white-space: nowrap; }
.mcard .acts span.hot .wave { opacity: 1; animation: blink .5s steps(1) 3; }
.mpanel .mcard { position: relative; left: auto; top: auto; width: auto; margin: 6px 8px 0; }
/* Settings: a choice per row, its name small over its value, and the folder, Reload and Copy buttons under the Theme row */

.key.in { opacity: 1; transform: none; }

.cursor { position: absolute; left: 400px; top: 300px; width: 14px; height: 20px; z-index: 12; opacity: 0; transition: left .8s var(--ease-out), top .8s var(--ease-out), opacity .2s, transform .1s; pointer-events: none; }

.mdlg h4 { margin: 0 0 6px; font: 600 11px/1.2 var(--body); }

.mdlg .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.6); }
.mdlg .ft .b { border: 1px solid rgba(255,255,255,.15); border-radius: 3px; padding: 2px 7px; color: #fff; }
.dark { position: absolute; inset: 0; background: var(--term); opacity: 0; transition: opacity .6s; pointer-events: none; display: grid; place-content: center; justify-items: center; row-gap: 22px; z-index: 7; }

.wordmark .c { color: var(--accent); font-family: var(--wordmark-term); font-weight: 300; font-size: 1.046em; letter-spacing: 0; }

/* the card the film ends on, over the resumed window */
.card { position: absolute; left: 50%; top: 50%; width: 600px; max-width: calc(100% - 48px); max-height: calc(100% - 32px); overflow: auto; transform: translate(-50%, -46%); background: var(--panel); border: 1px solid var(--stroke-strong); border-radius: 8px; box-shadow: 0 24px 56px rgba(0,0,0,.5); padding: 22px 24px 18px; opacity: 0; transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); z-index: 20; }

<script>
(function () {
  'use strict';
  const host = window.chrome && window.chrome.webview;

  };

  const RAIL = {

  // ---------- what the film shows: the script's ten tabs, with the PC's own folders and agents laid over it when the host sends them ----------

  // recognize (the film's own, never the PC's: a personal folder name had shown up here). Tabs 0, 6 and 8 work in one

  const SCRIPT = [
    { a: 'claude', e: '🚀', n: 'Repos' }, { a: 'codex', n: 'Issues' },
    { a: 'claude', e: '📘', n: 'Obsidian' }, { a: 'hermes', n: 'Projects' },
    { a: 'claude', n: 'Knowledge' }, { a: 'opencode', e: '📣', n: 'Marketing' },
    { a: 'codex', e: '🚀', n: 'Repos · tests', f: 'Repos' }, { a: 'claude', n: 'Business' },
    { a: 'hermes', e: '🚀', n: 'Repos · release', f: 'Repos' },

  const FOUND = { a: 'claude', n: 'SicTerm privacy questions', f: 'Scripts' };

  function haveAgents() { const have = C.agents.map(a => a.id).filter(id => LETTER[id]); return have.length ? have : ALL_AGENTS; }

      // 3. the resume, named first: the pointer resumes one session from its placeholder's button, which loads and prints its

      const f5 = opened + 3600; beat('Resume', f5);

  // ---------- the card: what SicTerm found on this PC ----------
  function listNames(names) { return names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]; }
  function cardHtml() {
    const have = C.agents;
    const agentsLine = !C.ready
      ? 'Looking for the agents and reading their histories…'
      : have.length
        ? `<span class="tiles">${have.map(a => tile(a.id)).join('')}</span><b>${esc(listNames(have.map(a => a.name)))}</b> detected, each launched as your own install, unmodified.`
        : 'No agent found yet. SicTerm looks for <b>Claude Code, Codex, Hermes and OpenCode</b> on PATH; Settings → Agents says where it looked, and finds one as soon as it is installed.';
    const histLine = !C.ready ? '' : C.conversations
      ? `<b>${C.conversations} saved conversation${C.conversations === 1 ? '' : 's'}</b> in ${C.folders} folder${C.folders === 1 ? '' : 's'}, read from the agents' own histories.` + (C.latest ? ` The latest, ${esc(C.latest.when)}: <b>${esc(C.latest.title)}</b>, in <span class="m">${esc(C.latest.folder)}</span>.` : '')
      : 'No saved conversations yet. The first one appears in Sessions as soon as an agent writes it, searchable by title, folder and what was said.';
    const pinLine = !C.ready ? '' : C.pinned
      ? `<b>${C.pinned} workspace${C.pinned === 1 ? '' : 's'} from your history</b>, each with its folder as its home. A workspace's home can take an emoji, a tab color and a sound.`
      : 'Workspaces group your tabs by project. Once there is history, one is made for each folder used most.';
    const line = (ico, text) => text ? `<div class="ln"><span class="ico">${ico}</span><span>${text}</span></div>` : '';
    return `
      <div class="top">${markSvg(48)}<div>${wordmark(26)}<div class="sub">One window for Claude Code, Codex, Hermes and OpenCode, in the folders you already work in. Close it with ten sessions running; open it with ten sessions waiting.</div></div></div>
      <div class="ctx"><div class="ey">On this PC</div>${line(ICO.agents, agentsLine)}${line(ICO.list, histLine)}${line(ICO.pin, pinLine)}</div>
      <div class="btns"><button type="button" class="btn primary" id="tour">Show me around <span class="k">2 min</span></button><button type="button" class="btn" id="start">Start</button><button type="button" class="link" id="again">Replay</button></div>
      <div class="foot">Replay any time from Settings → About → Welcome tour. Esc closes this card.</div>`;
  }
  function finish() {
    film.classList.add('ambient');
    const card = $('card');
    const fresh = card.hidden;
    card.innerHTML = cardHtml();
    card.hidden = false; if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('in'))); else card.classList.add('in');
    card.querySelector('#again').onclick = () => { play(); clock.playing = true; };
    card.querySelector('#start').onclick = () => post({ type: 'start' });
    card.querySelector('#tour').onclick = () => post({ type: 'tour' });
    setTimeout(() => { const b = card.querySelector('#tour'); if (b) b.focus({ preventScroll: true }); }, 350);
    if (fresh) post({ type: 'card' });
  }
  // Skip, Esc or a click: the frame the film ends on, the next launch's resumed window, then the card.
  function jumpToEnd() {
    clear(); looping = false;
    caption(''); caption('', 'dark');
    dark.classList.remove('in'); darkMark.className = 'mk'; led.classList.add('on');
    desk.classList.remove('off'); desk.classList.add('on'); tbtn.className = 'tbtn run';
    cursor.className = 'cursor'; ghost.className = 'ghost'; dropmark.className = 'dropmark'; dlg.className = 'mdlg'; key.className = 'key'; notice.classList.remove('in');
    rail.querySelectorAll('.rb').forEach(b => b.className = 'rb'); mini.querySelectorAll('.callout').forEach(c => c.remove());
    if (!filmTabs.length) { filmTabs = buildTabs(); found = foundTab(); }
    // the day's marks on the workspace the Workspaces beat dressed, whether or not the film got that far
    filmTabs[3].e = '🎯'; filmTabs[3].tc = '#B07AC4';
    // and the Settings beat's choices: the sidebar on the right, the tab bar at the bottom, the Outrun theme
    mini.classList.add('right', 'bottom'); applyTheme(THEMES.light);
    const tabs = closedTabs();
    strip.innerHTML = ''; strp = tabs.map(s => { const el = tabEl(s.t); el.classList.add('in', 'rest'); strip.appendChild(el); return el; }); strp[0].classList.add('sel');
    setLayout(tabs[0].panes.map((t, j) => { const p = paneEl(t, ctxOf(t, j)); p.classList.add('in'); return p; }), 'four');
    setCount(10, 0, 7); showMeters();
    panel.innerHTML = ''; mini.classList.remove('closed', 'panel', 'full');
  }
  function skipToEnd() {
    if (scrub) { clock.playing = false; seek(total); return; }
    if ($('card').hidden) { jumpToEnd(); finish(); }
  }

  // ---------- scrub mode: the toolbar and the clock it drives ----------
  let total = 0, scrubMarks = [], rafLast = 0, audio;
  const fmt = ms => { const s = Math.max(0, ms) / 1000; return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}.${Math.floor((s % 1) * 10)}`; };
  function startScrub() {
    const bar = document.createElement('div'); bar.className = 'scrub'; bar.id = 'scrub';
    bar.innerHTML = `<button type="button" id="sPlay" title="Play or pause (Space)">❚❚</button><span class="t" id="sNow">0:00.0</span><div class="range"><input type="range" id="sBar" min="0" max="1000" step="50" value="0" title="Scrub (← → a second, with Shift five; Home, End)"><div class="ticks" id="sTicks"></div></div><span class="t" id="sTotal">0:00.0</span><select id="sSpeed" title="Speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><span class="chime" id="sChime">♪ chime</span><span class="err" id="sErr"></span><div class="beats" id="sBeats"></div>`;
    document.body.appendChild(bar);
    fit();
    // a silent run to the end gives the film's length and its beats
    probing = true; document.documentElement.classList.add('noanim');
    play(); run(Infinity); total = lastFired; scrubMarks = beats.slice();
    document.documentElement.classList.remove('noanim'); probing = false;
    $('sBar').max = total; $('sTotal').textContent = fmt(total);
    $('sTicks').innerHTML = scrubMarks.map(b => `<i style="left:${(b.t / total * 100).toFixed(2)}%" title="${esc(b.name)}"></i>`).join('');
    $('sBeats').innerHTML = scrubMarks.map((b, i) => `<button type="button" data-i="${i}" title="${fmt(b.t)}">${esc(b.name)}</button>`).join('');
    $('sBeats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { seek(scrubMarks[+b.dataset.i].t); b.blur(); } });
    $('sPlay').addEventListener('click', () => { togglePlay(); $('sPlay').blur(); });
    $('sBar').addEventListener('input', () => { clock.playing = false; seek(+$('sBar').value); });
    $('sSpeed').addEventListener('change', () => { clock.speed = +$('sSpeed').value; $('sSpeed').blur(); });
    seek(0); clock.playing = true;
    requestAnimationFrame(tick);
  }
  // To a moment: on from here, or from the start when going back or after the end, with every transition and animation held
  // so the film lands on that frame
  function seek(ms) {
    document.documentElement.classList.add('noanim');
    if (ms < clock.now || (!queue.length && !looping)) play();
    run(ms);
    void document.body.offsetWidth;
    document.documentElement.classList.remove('noanim');
    scrubSync();
  }
  function tick(ts) {
    const dt = rafLast ? ts - rafLast : 0; rafLast = ts;
    if (clock.playing) {
      if (queue.length) run(clock.now + dt * clock.speed); else clock.playing = false;
      scrubSync();
    }
    requestAnimationFrame(tick);
  }
  function togglePlay() {
    if (!queue.length && !looping) { play(); clock.playing = false; }
    clock.playing = !clock.playing; scrubSync();
  }
  function scrubSync() {
    const bar = $('sBar'); if (!bar) return;
    bar.value = Math.min(clock.now, total); $('sNow').textContent = fmt(clock.now);
    $('sErr').textContent = scrubErrors ? `⚠ ${scrubErrors} error${scrubErrors > 1 ? 's' : ''}, see the console` : '';
    $('sPlay').textContent = clock.playing ? '❚❚' : (!queue.length && !looping ? '↺' : '▶');
    let cur = -1; scrubMarks.forEach((b, i) => { if (b.t <= clock.now + 1) cur = i; });
    [...$('sBeats').children].forEach((b, i) => b.classList.toggle('cur', i === cur));
  }
  function scrubKeys(e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return false;
    const step = e.shiftKey ? 5000 : 1000;
    if (e.key === ' ') togglePlay();
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { clock.playing = false; seek(Math.max(0, Math.min(total, clock.now + (e.key === 'ArrowLeft' ? -step : step)))); }
    else if (e.key === 'Home') { clock.playing = false; seek(0); }
    else if (e.key === 'End') { clock.playing = false; seek(total); }
    else return false;
    e.preventDefault(); return true;
  }
  // The toolbar's cue for the chime the window would ring: a word lit for a moment, and two notes
  function scrubChime() {
    const el = $('sChime'); if (el) { el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 700); }
    try {
      audio = audio || new AudioContext();
      if (audio.state === 'suspended') audio.resume();
      const t0 = audio.currentTime;
      [[880, 0], [1174.66, .13]].forEach(([f, d]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = f; g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.18, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .4);
        o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + .45);
      });
    } catch (e) { /* no audio: the word is the cue */ }
  }

  // ---------- the host ----------
  // The themes the Settings beat clicks through, as the host would send them (Sic.Core/Appearance/Themes, the rail composed
  // over the base): Outrun, Aurora, then SicTerm Light, which the film keeps
  const THEMES = {
    outrun: { name: 'Outrun', base: '#1B1036', rail: '#160D2B', panel: '#261650', layer: 'rgba(255,255,255,.059)', hover: 'rgba(255,255,255,.078)', stroke: 'rgba(247,168,224,.149)', strokeStrong: 'rgba(247,168,224,.251)', text: '#FFFFFF', textSecondary: '#F7A8E0', textTertiary: 'rgba(247,168,224,.651)', stripText: 'rgba(255,255,255,.702)', accent: '#FF3EA5', accentText: '#1B1036', accentSoft: 'rgba(255,62,165,.2)', success: '#2EF2B0', warning: '#FFD23F', danger: '#FF6B2B', displayFont: 'Sora' },
    aurora: { name: 'Aurora', base: '#08131E', rail: '#060F18', panel: '#0E1E2E', layer: 'rgba(255,255,255,.059)', hover: 'rgba(255,255,255,.078)', stroke: 'rgba(158,245,208,.149)', strokeStrong: 'rgba(158,245,208,.251)', text: '#FFFFFF', textSecondary: '#9EF5D0', textTertiary: 'rgba(158,245,208,.651)', stripText: 'rgba(255,255,255,.702)', accent: '#3DF2A8', accentText: '#08131E', accentSoft: 'rgba(61,242,168,.2)', success: '#A3E35D', warning: '#FFD166', danger: '#FF6B8B', displayFont: 'Sora' },
    light: { name: 'SicTerm Light', base: '#F7F8F9', rail: '#003050', panel: '#FFFFFF', layer: '#FFFFFF', hover: 'rgba(0,0,0,.039)', stroke: '#E2E6E9', strokeStrong: '#C4CBCF', text: '#3E4549', textSecondary: '#495055', textTertiary: '#60686D', stripText: 'rgba(255,255,255,.8)', accent: '#C04F1A', accentText: '#FFFFFF', accentSoft: 'rgba(192,79,26,.122)', success: '#1E7D3C', warning: '#A98519', danger: '#B0193A', displayFont: 'Sora' },
  };
  const themedVars = new Set();
  function applyTheme(t) {
    const r = document.documentElement.style;
    const set = (name, value) => { if (value) { r.setProperty(name, value); themedVars.add(name); } };
    set('--base', t.base); set('--rail', t.rail); set('--panel', t.panel); set('--layer', t.layer); set('--hover', t.hover);
    set('--stroke', t.stroke); set('--stroke-strong', t.strokeStrong); set('--text', t.text); set('--text2', t.textSecondary); set('--text3', t.textTertiary); set('--strip-text', t.stripText);
    set('--accent', t.accent); set('--accent-ink', t.accentText); set('--accent-soft', t.accentSoft);
    set('--ok', t.success); set('--warn', t.warning); set('--danger', t.danger);
    set('--h-hermes', t.hermes); set('--h-claude', t.claude); set('--h-codex', t.codex); set('--h-opencode', t.opencode);
    if (t.displayFont) set('--display', `"${t.displayFont}", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif`);
  }
  // Back to the host's theme, or the page's own, when the film starts again after the Settings beat changed it
  function restoreTheme() {
    if (hostTheme) applyTheme(hostTheme);
    else { themedVars.forEach(name => document.documentElement.style.removeProperty(name)); themedVars.clear(); }
  }
  if (host) host.addEventListener('message', event => {
    const m = event.data || {};
    if (m.type === 'init') { if (m.theme) { hostTheme = m.theme; applyTheme(m.theme); } if (!scrub) play(); }
    else if (m.type === 'context') { C = { ...C, ...m }; if (!$('card').hidden) finish(); }
    else if (m.type === 'skip') skipToEnd();
    else if (m.type === 'replay') play();
  });
  addEventListener('keydown', e => {
    if (scrub && scrubKeys(e)) return;
    if (e.key === 'Escape') { e.preventDefault(); if (!$('card').hidden) post({ type: 'start' }); else skipToEnd(); }
    else if (e.key === 'Enter' && !$('card').hidden && document.activeElement && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); post({ type: 'tour' }); }
  });
  $('film').addEventListener('click', () => { if (scrub) togglePlay(); else if ($('card').hidden) skipToEnd(); });
  fit();
  post({ type: 'ready' });
  // Outside the app (opened in a browser) the film plays with the sample facts.
  if (scrub) startScrub(); else if (!host) play();
})();
</script>
